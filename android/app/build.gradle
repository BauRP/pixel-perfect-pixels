apply plugin: 'com.android.application'

android {
    namespace = "app.lovable.privacygallery"
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "app.lovable.privacygallery"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // MultiDex support
        multiDexEnabled true
        
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.DS_Store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    buildFeatures {
        buildConfig true
    }

    // Optional release signing from CI secrets / local gradle properties.
    def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: (project.findProperty("releaseStoreFile") ?: "")
    signingConfigs {
        if (ksPath && file(ksPath).exists()) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("releaseStorePassword")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("releaseKeyAlias")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("releaseKeyPassword")
            }
        }
    }

    // Test-only consent debugging, never present in release:
    //   ./gradlew assembleDebug -PumpDebugGeography=EEA -PumpTestDeviceId=<hashed id from logcat>
    def umpGeo = (project.findProperty("umpDebugGeography") ?: "").toString()
    def umpDevice = (project.findProperty("umpTestDeviceId") ?: "").toString()
    // Google's native ad validator popup: off unless explicitly requested (-PadsNativeValidator=true).
    // Tolerate networks Android marks as not validated (emulators, some Wi-Fi). Release default: true;
    // pass -PadsAllowUnvalidated=false to require a validated network in release.
    def allowUnvalidated = (project.findProperty("adsAllowUnvalidated") ?: "true").toString()
    def nativeValidator = (project.findProperty("adsNativeValidator") ?: "false").toString()

    buildTypes {
        debug {
            buildConfigField "boolean", "USE_TEST_ADS", "true"
            buildConfigField "boolean", "ALLOW_UNVALIDATED_NETWORK", "true"
            buildConfigField "long", "DEBUG_CONSENT_FALLBACK_MS", "10000L"
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"${umpGeo}\""
            buildConfigField "String", "UMP_TEST_DEVICE_ID", "\"${umpDevice}\""
            manifestPlaceholders = [nativeAdDebuggerEnabled: nativeValidator]
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "USE_TEST_ADS", "false"
            buildConfigField "boolean", "ALLOW_UNVALIDATED_NETWORK", "${allowUnvalidated}"
            // Release never bypasses consent.
            buildConfigField "long", "DEBUG_CONSENT_FALLBACK_MS", "0L"
            buildConfigField "String", "UMP_DEBUG_GEOGRAPHY", "\"\""
            buildConfigField "String", "UMP_TEST_DEVICE_ID", "\"\""
            manifestPlaceholders = [nativeAdDebuggerEnabled: "false"]
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    // Google Mobile Ads SDK — used only by NativeAdsPlugin.java (native advanced slot).
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    // Google UMP SDK — EEA/UK consent gathered before MobileAds.initialize().
    implementation "com.google.android.ump:user-messaging-platform:$userMessagingPlatformVersion"

    // MultiDex runtime
    implementation 'androidx.multidex:multidex:2.0.1'
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
