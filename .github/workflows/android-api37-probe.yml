name: Android 17 API 37 isolated build

# Keep the production APK on the verified SDK 36 until this job passes.
# Compile with API 37 in a temporary CI checkout, NEVER modify main or
# commit the temporary SDK bump.
on:
  push:
    branches: [ 'chatgpt/nova-gallery-*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-api37-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api37:
    name: Android 17 API 37 compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install official Android 17 SDK and temporarily configure API 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list | grep -E 'android-37|build-tools;37' | tee android37-available.txt || true
          sdkmanager --install 'platforms;android-37' 'build-tools;37.0.0'
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 37/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 37/' android/variables.gradle
          grep -q 'compileSdkVersion = 37' android/variables.gradle
          grep -q 'targetSdkVersion = 37' android/variables.gradle
          echo 'Android 17 platform installed and compile/target SDK = 37 for this CI run.'
      - name: Build Android 17-compatible debug APK
        run: |
          bun install --frozen-lockfile
          bun run build:capacitor
          python3 scripts/check_legacy_webview.py
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Preserve Android 17 probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-android17-build-probe
          path: android37-available.txt
          if-no-files-found: warn
          retention-days: 3
