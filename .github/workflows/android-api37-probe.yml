name: Android 17 API 37 build probe

# Manual experimental check only: hosted runners currently cannot install
# API 37. Do not run a known-failing probe on each production-APK commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-api37-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api37:
    name: API 37 compile experiment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Experimental only; do not mark failed SDK 37 probes as success.
    # The independently verified SDK 36 APK workflow remains separate.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Discover and install Android 17 platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --list | tee api37-packages.txt
          # Android 17 is API 37; early SDK distributions may use the
          # preview codename rather than the numbered platform package.
          if ! sdkmanager --channel=3 'platforms;android-37'; then
            sdkmanager --channel=3 'platforms;android-CinnamonBun'
          fi
          if [[ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]]; then
            echo 'SDK 37 android.jar not installed; SDK 37 NOT certified.' >&2
            exit 1
          fi
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 37/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 37/' android/variables.gradle
          sed -i 's/rootProject.ext.compileSdkVersion : 36/rootProject.ext.compileSdkVersion : 37/' android/capacitor-cordova-android-plugins/build.gradle
          sed -i 's/rootProject.ext.targetSdkVersion : 36/rootProject.ext.targetSdkVersion : 37/' android/capacitor-cordova-android-plugins/build.gradle
          echo 'API 37 compilation configured.'
      - name: Build app with Android 17 API
        run: |
          bun install --frozen-lockfile
          bun run build:capacitor
          cd android
          ./gradlew :app:assembleDebug --stacktrace
      - name: Save SDK discovery and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-17-sdk-probe
          path: api37-packages.txt
          if-no-files-found: warn
          retention-days: 3
