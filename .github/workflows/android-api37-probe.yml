name: Android 17 API 37 isolated build

# Keep the production APK on the verified SDK 36 until this job passes.
# Compile with API 37 in a temporary CI checkout, NEVER modify main or
# commit the temporary SDK bump.
on:
  push:
    # A PROGRESS.md update is mandatory after every user request. Do not
    # rebuild APKs for documentation-only commits; mixed code+docs pushes
    # still run the complete workflow, and workflow_dispatch is unaffected.
    paths-ignore:
      - 'PROGRESS.md'
      - 'AGENTS2.md'
    branches: [ 'chatgpt/nova-gallery-*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-api37-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api37:
    name: Android 17 API 37 compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install official Android 17 SDK and temporarily configure API 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list | grep -E 'android-37|build-tools;37' | tee android37-available.txt || true
          # Official Google SDK manager publishes API 37 as android-37.0
          # (confirmed in CI #41345294671), not android-37.
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # AGP 8.13.0 (production) does not support the 37.0 SDK identifier.
          # Official API 37 support requires AGP >=9.1.1. Upgrade AGP and
          # its Gradle wrapper only in this disposable CI checkout.
          sed -i "s/gradle:8.13.0/gradle:9.2.0/" android/build.gradle
          sed -i 's/gradle-8.13-bin.zip/gradle-9.4.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          # services.gradle.org currently redirects the 9.4.1 ZIP to a
          # GitHub release endpoint returning intermittent HTTP 504 in CI.
          # The official Gradle distributions CDN serves the same release,
          # without the flaky GitHub-release redirect. This is restricted to
          # the disposable API37 checkout, not production SDK/Gradle.
          sed -i 's#services.gradle.org/distributions/#downloads.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 37/' android/variables.gradle
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 37/' android/variables.gradle
          # Capacitor Filesystem uses the legacy Kotlin Android plugin;
          # opt out of AGP 9 built-in Kotlin/new DSL in this probe only.
          printf '%s\n' 'android.builtInKotlin=false' 'android.newDsl=false' >> android/gradle.properties
          grep -Fxq 'android.builtInKotlin=false' android/gradle.properties
          grep -Fxq 'android.newDsl=false' android/gradle.properties
          grep -q "gradle:9.2.0" android/build.gradle
          grep -q 'gradle-9.4.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'compileSdkVersion = 37' android/variables.gradle
          grep -q 'targetSdkVersion = 37' android/variables.gradle
          echo 'Temporary API 37 + AGP 9.2 / Gradle 9.4.1 configured; release SDK 36 unchanged.'
      - name: Build Android 17-compatible debug APK
        run: |
          # Match the successfully verified APK workflow. The repository's
          # lockfile is not frozen-compatible with Bun 1.3.2 yet; freezing
          # it stops the SDK 37 experiment before the Android compiler runs.
          bun install
          bun run build:capacitor
          python3 scripts/check_legacy_webview.py
          cd android
          # Retry the wrapper download only; do not keep rebuilding the
          # project when Android compilation itself fails. HTTP 504 is an
          # external network error and must not be counted as a code failure.
          installed=false
          for attempt in 1 2 3; do
            if ./gradlew --version; then installed=true; break; fi
            sleep 8
          done
          if [ "$installed" != true ]; then
            echo 'Gradle distribution unavailable after 3 attempts' >&2
            exit 1
          fi
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Preserve Android 17 probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-android17-build-probe
          path: android37-available.txt
          if-no-files-found: warn
          retention-days: 3
