name: Build Android APK

on:
  push:
    branches: [ main, master, 'chatgpt/nova-gallery-*' ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: bun install

      - name: Run automated unit tests
        run: bunx vitest run

      - name: Build Web App for Android
        run: bun run build:capacitor

      - name: Validate Android project inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          xml_files = [
              Path("android/app/src/main/AndroidManifest.xml"),
          ]

          cordova_manifest = Path("android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml")
          if cordova_manifest.exists():
              xml_files.append(cordova_manifest)

          xml_files.extend(Path("android/app/src/main/res").rglob("*.xml"))

          for file in xml_files:
              ET.parse(file)

          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()
          required = [
              'android:name="androidx.multidex.MultiDexApplication"',
              'android:name="com.google.android.gms.ads.APPLICATION_ID"',
              'ca-app-pub-9902253594429663~9587409077',
              'com.google.android.gms.permission.AD_ID',
          ]
          for marker in required:
              if marker not in manifest:
                  raise SystemExit(f"missing AndroidManifest marker: {marker}")

          res = Path("android/app/src/main/res")
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon = res / f"mipmap-{density}" / name
                  if not icon.is_file() or icon.stat().st_size == 0:
                      raise SystemExit(f"missing launcher icon: {icon}")
          logo = res / "drawable" / "logo.png"
          if not logo.is_file() or logo.stat().st_size == 0:
              raise SystemExit("missing drawable/logo.png")
          PY

          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -x android/gradlew || chmod +x android/gradlew
          test -n "${ANDROID_HOME:-}"

      - name: Build Android APK
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            # Production: signed, non-debuggable release -> real ad unit, no validator.
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease --stacktrace --warning-mode all
          else
            # No signing key configured: debug build -> Google test ads only.
            ./gradlew :app:assembleDebug --stacktrace --warning-mode all
          fi

      - name: Save APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 1

      - name: Create Release & Upload APK (Official GitHub Link)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import json
          from pathlib import Path

          github_token = os.environ.get("GITHUB_TOKEN")
          repository = os.environ.get("GITHUB_REPOSITORY")
          run_number = os.environ.get("GITHUB_RUN_NUMBER")
          ref_name = os.environ.get("GITHUB_REF_NAME", "main")

          apk_files = list(Path("android/app/build/outputs/apk").rglob("*.apk"))
          if not apk_files:
              raise SystemExit("КРИТИЧЕСКАЯ ОШИБКА: APK файл не найден!")
          apk_path = apk_files[0]

          headers = {
              "Authorization": f"Bearer {github_token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          tag_name = f"build-{run_number}"
          release_data = json.dumps({
              "tag_name": tag_name,
              "target_commitish": ref_name,
              "name": f"APK Build #{run_number}",
              "body": "Автоматическая сборка APK Nova Gallery.",
              "draft": False,
              "prerelease": True
          }).encode("utf-8")

          print("Создание релиза на GitHub...")
          req = urllib.request.Request(f"https://api.github.com/repos/{repository}/releases", data=release_data, headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req) as resp:
                  release_json = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"Ошибка API GitHub: {e.code} - {e.read().decode('utf-8')}")
              raise

          upload_url_template = release_json["upload_url"]
          upload_url = upload_url_template.split("{")[0] + f"?name={apk_path.name}"

          print("Загрузка APK файла в релиз...")
          file_data = apk_path.read_bytes()
          upload_headers = {
              "Authorization": f"Bearer {github_token}",
              "Content-Type": "application/vnd.android.package-archive",
              "Content-Length": str(len(file_data))
          }

          req_upload = urllib.request.Request(upload_url, data=file_data, headers=upload_headers, method="POST")
          with urllib.request.urlopen(req_upload) as resp_upload:
              asset_json = json.loads(resp_upload.read().decode("utf-8"))

          download_url = asset_json["browser_download_url"]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("## 📱 Готовый файл APK Nova Gallery:\n\n")
              f.write(f"[🚀 НАЖМИ СЮДА, ЧТОБЫ СКАЧАТЬ APK]({download_url})\n")
          print(f"Ссылка успешно создана: {download_url}")
          PY
