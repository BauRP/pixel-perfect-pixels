name: Build Android APK

on:
  push:
    # A PROGRESS.md update is mandatory after every user request. Do not
    # rebuild APKs for documentation-only commits; mixed code+docs pushes
    # still run the complete workflow, and workflow_dispatch is unaffected.
    paths-ignore:
      - 'PROGRESS.md'
      - 'AGENTS2.md'
    branches: [ main, master, 'chatgpt/nova-gallery-*' ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check Android 7-17 SDK compatibility contract
        run: python3 scripts/check_android_compat.py

      - name: Install dependencies
        run: bun install

      - name: Run automated unit tests
        run: bunx vitest run

      - name: Verify screenshot evidence classifier across compact and wide screens
        run: |
          mkdir -p "$RUNNER_TEMP/nova-screenshot-checker"
          javac -d "$RUNNER_TEMP/nova-screenshot-checker" scripts/ValidateScreenshot.java scripts/ValidateScreenshotSelfTest.java
          java -cp "$RUNNER_TEMP/nova-screenshot-checker" ValidateScreenshotSelfTest

      - name: Build Web App for Android
        run: bun run build:capacitor

      - name: Verify standalone Android SPA and offline WebView assets
        run: python3 scripts/check_legacy_webview.py

      - name: Validate Android project inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          xml_files = [
              Path("android/app/src/main/AndroidManifest.xml"),
          ]

          cordova_manifest = Path("android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml")
          if cordova_manifest.exists():
              xml_files.append(cordova_manifest)

          xml_files.extend(Path("android/app/src/main/res").rglob("*.xml"))

          for file in xml_files:
              ET.parse(file)

          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()
          required = [
              'android:name="androidx.multidex.MultiDexApplication"',
              'android:name="com.google.android.gms.ads.APPLICATION_ID"',
              'ca-app-pub-9902253594429663~9587409077',
              'com.google.android.gms.permission.AD_ID',
          ]
          for marker in required:
              if marker not in manifest:
                  raise SystemExit(f"missing AndroidManifest marker: {marker}")

          res = Path("android/app/src/main/res")
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon = res / f"mipmap-{density}" / name
                  if not icon.is_file() or icon.stat().st_size == 0:
                      raise SystemExit(f"missing launcher icon: {icon}")
          logo = res / "drawable" / "logo.png"
          if not logo.is_file() or logo.stat().st_size == 0:
              raise SystemExit("missing drawable/logo.png")
          PY

          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -x android/gradlew || chmod +x android/gradlew
          test -n "${ANDROID_HOME:-}"

      - name: Build Android APK
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            # Production: signed, non-debuggable release -> real ad unit, no validator.
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease --stacktrace --warning-mode all
          else
            # No signing key configured: debug build -> Google test ads only.
            ./gradlew :app:assembleDebug --stacktrace --warning-mode all
          fi

      - name: Save APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 1

      # On the working branch publish the tested debug APK as a downloadable
      # GitHub Release asset, not merely an expiring GitHub Actions artifact.
      # Main/master keep their existing signed-release build policy.
      - name: Publish APK and SHA-256 as direct GitHub Release downloads
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/chatgpt/nova-gallery-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          source_sha = os.environ["GITHUB_SHA"]
          number = os.environ["GITHUB_RUN_NUMBER"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          token = os.environ["GITHUB_TOKEN"]
          is_preview = branch.startswith("chatgpt/nova-gallery-")

          output = Path("android/app/build/outputs/apk")
          # Do not accidentally distribute a test/instrumentation APK.
          candidates = [output / "debug/app-debug.apk",
                        output / "release/app-release.apk"]
          available = [path for path in candidates if path.is_file()]
          if len(available) != 1:
              raise SystemExit("Exactly one built application APK is required")
          apk = available[0]
          if is_preview and apk.name != "app-debug.apk":
              raise SystemExit("Working-branch APK must be debug/test-ads only")

          sha256 = hashlib.sha256()
          with apk.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  sha256.update(chunk)
          digest = sha256.hexdigest()
          checksum_name = apk.name + ".sha256"
          checksum_content = f"{digest}  {apk.name}\n".encode("ascii")

          # A new preview tag for each rerun, retaining the existing main
          # branch naming convention and production release behavior.
          tag = (f"nova-gallery-preview-{number}-a{attempt}"
                 if is_preview else f"build-{number}")
          title = (f"Nova Gallery test APK #{number} (attempt {attempt})"
                   if is_preview else f"APK Build #{number}")
          note = ("Debug APK with Google test ads; not a production release."
                  if is_preview else "Automatic Nova Gallery APK build.")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          release = {
              "tag_name": tag,
              "target_commitish": source_sha,
              "name": title,
              "body": f"{note}\nSource commit: {source_sha}",
              "draft": False,
              "prerelease": True,
          }
          request = Request(
              f"https://api.github.com/repos/{repository}/releases",
              data=json.dumps(release).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=60) as response:
              release_info = json.load(response)
          upload_root = release_info["upload_url"].split("{", 1)[0]

          def upload(filename, content, mime):
              endpoint = upload_root + "?name=" + quote(filename, safe="")
              request = Request(
                  endpoint,
                  data=content,
                  headers={
                      **headers,
                      "Content-Type": mime,
                      "Content-Length": str(len(content)),
                  },
                  method="POST",
              )
              with urlopen(request, timeout=120) as response:
                  return json.load(response)["browser_download_url"]

          apk_url = upload(apk.name, apk.read_bytes(),
                           "application/vnd.android.package-archive")
          checksum_url = upload(checksum_name, checksum_content, "text/plain")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("## 📱 Проверка APK Nova Gallery\n\n")
              file.write(f"Source commit: `{source_sha}`\n\n")
              file.write(f"SHA-256: `{digest}`\n\n")
              file.write("## Скачать APK\n\n")
              file.write(f"[Скачать Nova Gallery APK]({apk_url})\n\n")
              file.write(f"[SHA-256 контрольная сумма]({checksum_url})\n")
          print("Nova Gallery APK published to GitHub Releases.")
          print("Source SHA:", source_sha)
          print("SHA-256:", digest)
          PY
