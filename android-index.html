<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Nova Gallery</title>
  <script data-nova-boot-error="1">
  (function () {
    function hasLiveGallery() {
      var root = document.documentElement;
      // The native bridge separately validates the actual tappable tabs.
      // Avoid adding a fatal overlay when React has already rendered a
      // route, even if Android system insets are temporarily pending.
      return !!document.querySelector('[data-nova-route-content]') ||
        !!document.querySelector('[data-nova-privacy-screen]') ||
        !!document.querySelector('[data-nova-react-recovery]') ||
        (root && root.dataset.novaBootPhase === 'gallery-layout-ready');
    }
    function show(message) {
      var node = document.getElementById('root');
      // The startup handler is only for startup failures. On some older
      // WebViews a later ad/permission error triggered it and obscured a
      // usable gallery, which looked like a black-screen app regression.
      if (!node || hasLiveGallery() || document.querySelector('[data-nova-error]')) return;
      var el = document.createElement('div');
      el.setAttribute('data-nova-error','1');
      el.style.cssText='padding:48px 20px;min-height:55vh;background:#101116;color:white;font:16px sans-serif;text-align:center';
      el.textContent='Nova Gallery could not start: '+String(message||'unknown');
      var retry=document.createElement('button');
      retry.type='button';
      retry.textContent='Retry';
      retry.style.cssText='display:block;margin:24px auto;padding:14px 24px;border:1px solid #aaa;background:#222;color:white;border-radius:12px;min-height:44px';
      retry.onclick=function(){location.reload();};
      el.appendChild(retry);
      node.appendChild(el);
    }
    window.addEventListener('error',function (e) {
      // A resource loading error has no e.message. Do not turn a failed
      // thumbnail or optional native advertisement into a fatal app error.
      if (e && e.message) show(e.message);
    });
    window.addEventListener('unhandledrejection',function (e) {
      // Async failures after the React route starts are owned by the
      // component/plugin error boundaries, not the boot safety fallback.
      if (!hasLiveGallery()) show(e && e.reason && e.reason.message);
    });
    // Some WebViews stall silently during boot without throwing an exception.
    // Do not leave the user with a permanently blank screen.
    // Arm from parser execution, not window.load. Some old Android WebViews
    // wait forever for a module import and never dispatch load at all.
    // Users must see a retry action rather than a black, noninteractive UI.
    setTimeout(function(){
      if(!hasLiveGallery() &&
         !document.querySelector('[data-nova-error]')){
        show('The gallery did not finish loading.');
      }
    },20000);
  })();
  </script>
</head>
<body>
  <div id="root">
    <!-- Shown until React replaces #root; no JS or network is required. -->
    <div id="nova-boot-status" role="status" aria-live="polite"
      style="box-sizing:border-box;min-height:75vh;padding:calc(48px + env(safe-area-inset-top,0px)) 24px 48px;background:#0b0b0f;color:#f5f5f7;font:16px/1.6 system-ui,sans-serif;text-align:center">
      Nova Gallery is starting…
    </div>
  </div>
  <script type="module" src="./src/android-client.tsx"></script>
</body>
</html>
